name: PR — Hygiene

# Funde os antigos "PR — Jira link" e "PR — Acceptance Criteria" num job só
# (KSA-439): o Actions cobra minuto CHEIO arredondado POR JOB, então dois
# workflows de ~5s custavam 2 minutos por evento — fundidos, custam 1.
#
# SEM `synchronize` de propósito: as duas checagens só leem o CORPO da PR
# (título/descrição/branch), que um push não muda — só uma edição. Re-rodar a
# cada push era pagar para revalidar o que não mudou. Pré-condição verificada:
# nenhum destes checks é `required` de branch protection (plano Free não tem);
# se um dia virarem, `synchronize` PRECISA voltar (check obrigatório é avaliado
# por SHA, e um SHA novo sem run ficaria pendente para sempre).
#
# Determinístico e de graça (sem IA/token): é só checagem de texto.

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    # PR em draft não gasta minuto; roda ao promover a ready (KSA-411).
    if: github.event.pull_request.draft == false
    steps:
      - name: Exigir referência a uma task do Jira
        # Título/descrição/branch vêm como env (não interpolados no script) para
        # evitar injeção de shell a partir de texto controlado pelo autor da PR.
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          text="$(printf '%s\n%s\n%s' "$TITLE" "$BODY" "$BRANCH" | tr '[:lower:]' '[:upper:]')"
          if printf '%s' "$text" | grep -Eq '\b(KSA|BFF)-[0-9]+\b'; then
            key="$(printf '%s' "$text" | grep -Eo '\b(KSA|BFF)-[0-9]+\b' | head -1)"
            echo "OK — PR referencia a task do Jira: ${key}"
          else
            echo "::error::Esta PR não referencia nenhuma task do Jira (ex.: KSA-123 ou BFF-45). Adicione a chave/link da task no título ou na descrição da PR."
            exit 1
          fi

      - name: Exigir Critérios de Aceite na descrição
        # Roda mesmo se o step anterior falhou: os dois problemas aparecem de uma
        # vez, em vez de o autor corrigir um, re-rodar e só então descobrir o outro.
        if: success() || failure()
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          filled="$(printf '%s\n' "$BODY" \
            | grep -E '\[AC-[0-9]+\]' \
            | grep -viE 'GIVEN[[:space:]]*\.\.\.[[:space:]]*WHEN' \
            | sed -E 's/.*\[AC-[0-9]+\][[:space:]:.-]*//' \
            | grep -E '[[:alpha:]].{9,}' \
            || true)"
          if [ -n "$filled" ]; then
            echo 'OK — Critérios de Aceite preenchidos na PR:'
            printf '%s\n' "$filled" | sed 's/^/   • /'
          else
            echo "::error::A seção 'Acceptance Criteria' está vazia ou só com o placeholder. Cole os [AC-N] (GIVEN/WHEN/THEN) da story do Jira na descrição da PR."
            exit 1
          fi
